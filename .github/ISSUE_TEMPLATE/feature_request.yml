name: 功能建议
description: 提出新功能或体验改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        小记的边界是「本地优先、无账号、无网络」。依赖服务端的功能（同步、分享链接、协作）不在计划内，
        其余建议都欢迎。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景，再说方案往往更容易被采纳
      placeholder: 我经常在地铁上记东西，回到工位想……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 比如用别的 App 怎么解决、为什么不够好
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 请确认
      options:
        - label: 这个功能不需要账号、联网或服务端
          required: false
