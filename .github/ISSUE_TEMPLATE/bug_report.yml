name: 问题反馈
description: 报告崩溃、数据异常或界面显示问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认已使用 [最新版本](https://github.com/oliverbuddy/private_notes/releases/latest)，旧版本的问题可能已修复。

  - type: input
    id: app-version
    attributes:
      label: 小记版本
      description: 设置页底部或 APK 文件名里的版本号
      placeholder: 1.3.1+5
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 机型 + Android 版本；模拟器请注明
      placeholder: Pixel 7 / Android 14
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量具体到点了哪个按钮、之前做过什么
      placeholder: |
        1. 打开设置，开启应用锁
        2. 退到后台再回来
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图或录屏更好；日志可通过 `adb logcat` 获取
    validations:
      required: true

  - type: checkboxes
    id: data-safety
    attributes:
      label: 数据情况
      options:
        - label: 涉及笔记丢失或内容损坏（这类问题请务必说明是否已导出备份）
        - label: 涉及锁定笔记或应用锁
        - label: 已尝试「导出全部」或备份恢复

  - type: markdown
    attributes:
      value: |
        **请不要在 issue 里贴出真实笔记内容、设备 PIN 或备份文件。**
