name: Release Desktop

# 桌面端正式包：macOS 通用 DMG + Windows x64 安装器。
#
# 触发方式与 Android 一致：推 v* 标签或手动触发。
# 全部构建在 GitHub 托管的机器上完成，本地不需要 Xcode / Visual Studio。
#
# 签名策略（与「不把签名材料放线上」一致）：
#   - macOS：ad-hoc 签名（codesign --sign -），不公证、不需要 Apple 开发者账号。
#     注意不能加 --options runtime：hardened runtime 会开启库校验，
#     而 ad-hoc 签名没有 Team ID，dyld 会以「different Team IDs」拒绝加载
#     FlutterMacOS.framework，表现是双击后应用立刻退出（v1.10.0 的实际故障）。
#   - Windows：安装器不签名（无代码签名证书）。SmartScreen 会提示「更多信息 → 仍要运行」。
#   - 仓库里没有任何证书/密钥；将来要正式签名，再按 Android 的方式
#     从 Secrets 读取，绝不把 p12/pfx 提交进仓库。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build macOS app
        run: |
          flutter pub get
          flutter build macos --release

      - name: Sign, package DMG
        run: |
          APP="build/macos/Build/Products/Release/xiaoji.app"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)

          # 只做 ad-hoc 签名。不要 --options runtime（见文件头说明）。
          codesign --force --deep --sign - \
            --entitlements macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # 打印实际签名，便于在 CI 日志里确认没有回退成未签名。
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Signature|TeamIdentifier|flags"

          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          # 安装后 Finder / 启动台显示的名字来自 .app 目录名，不是 Info.plist
          # 的 CFBundleDisplayName：不改这一层，装完图标下面还是「xiaoji」。
          mv "$STAGE/xiaoji.app" "$STAGE/小记.app"
          ln -s /Applications "$STAGE/Applications"
          {
            echo "小记 · macOS 安装说明"
            echo
            echo "1. 把「小记」拖到左侧的「应用程序」文件夹。"
            echo "2. 第一次打开会被系统拦下，因为本项目没有购买 Apple 开发者证书、未做公证："
            echo "   - macOS 14 及更早：在「应用程序」里右键「小记」→「打开」→ 再点「打开」。"
            echo "   - macOS 15 及更新：双击后按提示进入「系统设置 → 隐私与安全性」，"
            echo "     在页面下方点「仍要打开」。"
            echo "   只需放行一次，之后可正常双击启动。"
            echo "3. 若提示「已损坏」：在终端执行"
            echo "   xattr -dr com.apple.quarantine /Applications/小记.app"
            echo "   然后重新打开。"
            echo
            echo "数据只保存在本机，应用不发起任何网络请求。"
          } > "$STAGE/安装说明.txt"

          DMG="xiaoji-${VERSION}-macos-universal.dmg"
          hdiutil create -volname "小记 $VERSION" -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -ov "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          ls -lh "$DMG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoji-macos
          path: |
            xiaoji-*-macos-universal.dmg
            xiaoji-*-macos-universal.dmg.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Android 工作流负责写 Release 说明，这里只补文件。
          # 两个工作流可能同时创建同一个 Release，创建失败不影响后续上传。
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "小记 $GITHUB_REF_NAME" --notes "桌面端构建产物" || true
          gh release upload "$GITHUB_REF_NAME" \
            xiaoji-*-macos-universal.dmg \
            xiaoji-*-macos-universal.dmg.sha256 --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Split('+')[0]
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "未找到 Inno Setup 6（$iscc），请检查 runner 镜像"
          }
          # 简体中文语言文件不是官方安装包必带项，检测到才启用中文向导。
          $isccArgs = @("/DMyAppVersion=$version")
          if (Test-Path (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\Languages\ChineseSimplified.isl')) {
            $isccArgs += "/DWithZh"
          }
          & $iscc @isccArgs "windows\installer\xiaoji.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败（exit $LASTEXITCODE）" }

          $name = "xiaoji-$version-windows-x64-setup.exe"
          Move-Item "windows\installer\Output\$name" $name -Force
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "$name.sha256" -Encoding ascii -NoNewline
          Get-Item $name | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoji-windows
          path: |
            xiaoji-*-windows-x64-setup.exe
            xiaoji-*-windows-x64-setup.exe.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "小记 $env:GITHUB_REF_NAME" --notes "桌面端构建产物"
            if ($LASTEXITCODE -ne 0) { Write-Host "Release 已由另一个工作流创建，继续上传" }
          }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem "xiaoji-*-windows-x64-setup.exe*" | ForEach-Object { $_.Name }) --clobber
