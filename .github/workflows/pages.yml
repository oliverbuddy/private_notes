name: Deploy Site

# 落地页：docs/ 静态站点，推 main 时自动部署到 GitHub Pages。
#
# 前置条件（只需一次）：仓库 Settings → Pages → Build and deployment →
# Source 选「GitHub Actions」。GITHUB_TOKEN 没有仓库管理员权限，无法用
# configure-pages 的 enablement 自动建站（会报 Resource not accessible
# by integration），所以这一步必须手动开启。
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
