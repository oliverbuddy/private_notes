name: Release APK

# 触发：推 v* 标签（正式发布）或在 Actions 页手动触发。
# Fork PR 拿不到 Secrets（GitHub 默认），且下面显式排除了 pull_request 事件，
# 他人 fork 改代码后无法借 CI 拿到签名密钥。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 关于 environment 审批：GitHub 免费计划的私有仓库不含 protected
# environments（API 404）。发布准入由「手动触发 / 推 v* 标签」控制——
# 只有仓库主人能做这两件事。升级 GitHub Pro 后可加回：
#   environment: release
# 并在 Settings → Environments → release 配置必需审核人。

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS

      - name: Build release APK
        run: |
          flutter pub get
          # 只打真机用得到的两种 ABI：默认三 ABI 会把 Flutter 引擎和 Dart
          # 产物各拷三份（55MB）；去掉仅供模拟器的 x86_64 后约 36MB。
          flutter build apk --release \
            --target-platform android-arm,android-arm64

      - name: Rename artifact and checksum
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          APK="private_notes-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"

      # 手动触发：构建产物挂在 workflow run 的 Artifacts 区供下载。
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: private_notes-apk
          path: |
            private_notes-*.apk
            private_notes-*.apk.sha256

      # 自己拼 Release 说明：先给安装步骤，再列本次提交。
      # 不用 generate_release_notes + append_body：后者只在「更新已有
      # Release」时追加，新建 Release 会被忽略（v1.3.2 踩过）。
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "### 下载与安装"
            echo
            echo "- 下载上面的 \`.apk\` 安装，Android 7.0 及以上。"
            echo "- 覆盖安装即可升级，笔记与设置保留，无需卸载旧版。"
            echo "- 同名 \`.sha256\` 是安装包校验值，可用 \`sha256sum\` 核对。"
            echo "- 自动更新：在 Obtainium 中添加仓库 \`${GITHUB_REPOSITORY}\`。"
            echo
            echo "更多说明与截图：https://oliverbuddy.github.io/private_notes/"
            echo
            echo "### 本版变更"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:"- %s" "$PREV..HEAD"
              echo
              echo
              echo "完整对比：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            else
              git log --no-merges -10 --pretty=format:"- %s"
              echo
            fi
          } > RELEASE_NOTES.md

      # 推 v* 标签：自动创建 GitHub Release 并附 APK + 校验和，供他人下载。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 小记 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            private_notes-*.apk
            private_notes-*.apk.sha256
