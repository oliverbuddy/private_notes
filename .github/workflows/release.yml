name: Release APK

# 触发：推 v* 标签（正式发布）或在 Actions 页手动触发。
# Fork PR 拿不到 Secrets（GitHub 默认），且下面显式排除了 pull_request 事件，
# 他人 fork 改代码后无法借 CI 拿到签名密钥。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 关于 environment 审批：GitHub 免费计划的私有仓库不含 protected
# environments（API 404）。发布准入由「手动触发 / 推 v* 标签」控制——
# 只有仓库主人能做这两件事。升级 GitHub Pro 后可加回：
#   environment: release
# 并在 Settings → Environments → release 配置必需审核人。

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Rename artifact
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          cp build/app/outputs/flutter-apk/app-release.apk "private_notes-${VERSION}.apk"

      # 手动触发：构建产物挂在 workflow run 的 Artifacts 区供下载。
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: private_notes-apk
          path: private_notes-*.apk

      # 推 v* 标签：自动创建 GitHub Release 并附 APK，供他人下载。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: private_notes-*.apk
          generate_release_notes: true
